<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2F0EA">
  <title>Reset Password — NovaPress</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./js/lucide.min.js"></script>
</head>
<body class="auth-page">
  <div class="auth-layout">
    <div class="auth-brand">
      <a href="./index.html" class="brand" aria-label="NovaPress home">
        <img src="./logo.svg" alt="NovaPress" class="brand-logo">
      </a>
    </div>

    <div class="auth-card" id="requestCard">
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>
      <div id="notice" class="auth-notice" hidden></div>
      <form id="forgotForm" class="auth-form" novalidate>
        <div class="field">
          <label for="email"><span>EMAIL</span></label>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <span class="field-error" id="emailError"></span>
        </div>
        <button type="submit" id="submitBtn" class="primary-button w-full">Send reset link <span>→</span></button>
      </form>
      <p class="auth-switch"><a href="./login.html" class="auth-link">â† Back to sign in</a></p>
    </div>

    <div class="auth-card" id="sentCard" hidden>
      <div class="confirm-icon"><i data-lucide="mail-check" style="width:40px;height:40px;color:var(--accent)"></i></div>
      <h1 class="auth-title">Check your email</h1>
      <p class="auth-subtitle" id="sentMsg">A password reset link has been sent to your email.</p>
      <p class="auth-switch" style="margin-top:24px"><a href="./login.html" class="auth-link">â† Back to sign in</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>
  <script type="module">
    import { resetPasswordForEmail } from "./js/auth.js";

    window.lucide?.createIcons();

    const form = document.getElementById("forgotForm");
    const submitBtn = document.getElementById("submitBtn");
    const notice = document.getElementById("notice");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      if (!email) { document.getElementById("emailError").textContent = "Email is required"; return; }
      document.getElementById("emailError").textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";
      try {
        await resetPasswordForEmail(email);
        document.getElementById("requestCard").hidden = true;
        document.getElementById("sentCard").hidden = false;
        document.getElementById("sentMsg").textContent = `A password reset link has been sent to ${email}.`;
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Send reset link <span>→</span>';
        notice.textContent = err.message || "Failed to send reset email";
        notice.hidden = false;
        notice.className = "auth-notice auth-notice--error";
      }
    });
  </script>
</body>
</html>
