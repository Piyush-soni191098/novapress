<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2F0EA">
  <title>Settings — NovaPress</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./js/lucide.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./dashboard.html"><img src="./logo.svg" alt="NovaPress" class="brand-logo"></a>
    <nav class="top-nav">
      <a href="./dashboard.html" class="nav-link">Feed</a>
      <a href="./discover.html" class="nav-link">Discover</a>
      <a href="./bookmarks.html" class="nav-link">Bookmarks</a>
      <a href="./insights.html" class="nav-link">Insights</a>
    </nav>
    <div class="topbar-right">
      <a href="./settings.html" class="icon-button icon-button--active" title="Settings"><i data-lucide="settings"></i></a>
    </div>
  </header>
  <nav class="mobile-nav">
    <a href="./dashboard.html" class="mobile-nav-item"><i data-lucide="newspaper"></i><span>Feed</span></a>
    <a href="./discover.html" class="mobile-nav-item"><i data-lucide="compass"></i><span>Discover</span></a>
    <a href="./bookmarks.html" class="mobile-nav-item"><i data-lucide="bookmark"></i><span>Saved</span></a>
    <a href="./insights.html" class="mobile-nav-item"><i data-lucide="bar-chart-2"></i><span>Insights</span></a>
    <a href="./settings.html" class="mobile-nav-item mobile-nav-item--active"><i data-lucide="settings"></i><span>Settings</span></a>
  </nav>

  <main class="shell">
    <div class="page-header">
      <h1 class="page-title">Settings</h1>
    </div>

    <div id="settingsNotice" class="auth-notice" hidden></div>

    <div class="settings-sections">
      <!-- Profile -->
      <section class="settings-section panel">
        <h2 class="settings-section-title">Profile</h2>
        <div class="field">
          <label for="displayName"><span>DISPLAY NAME</span></label>
          <input id="displayName" type="text" placeholder="Your name" maxlength="60">
        </div>
        <div class="field">
          <label><span>EMAIL</span></label>
          <p id="userEmail" class="settings-static">Loading…</p>
        </div>
        <button id="saveProfile" class="primary-button">Save profile</button>
      </section>

      <!-- Interests -->
      <section class="settings-section panel">
        <h2 class="settings-section-title">Your Interests</h2>
        <p class="settings-desc">Topics you follow shape your personalized feed.</p>
        <div id="currentInterests" class="interest-pills-wrap"></div>
        <a href="./discover.html" class="secondary-button" style="margin-top:12px;display:inline-flex">Edit on Discover →</a>
      </section>

      <!-- Feed preferences -->
      <section class="settings-section panel">
        <h2 class="settings-section-title">Feed Preferences</h2>
        <div class="field">
          <label for="prefLang"><span>PREFERRED LANGUAGE</span></label>
          <select id="prefLang">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="pt">Portuguese</option>
          </select>
        </div>
        <div class="field">
          <label for="prefCountry"><span>REGION (OPTIONAL)</span></label>
          <input id="prefCountry" type="text" placeholder="e.g. India, US, UK" maxlength="60">
        </div>
        <label class="field toggle-field" for="trackingEnabled">
          <div class="toggle-field-text">
            <span class="toggle-field-title">Enable personalization tracking</span>
            <span class="toggle-field-desc">NovaPress learns from your reading to improve recommendations.</span>
          </div>
          <span class="toggle-switch">
            <input type="checkbox" id="trackingEnabled">
            <span class="toggle-thumb"></span>
          </span>
        </label>
        <button id="savePreferences" class="primary-button">Save preferences</button>
      </section>

      <!-- Account -->
      <section class="settings-section panel">
        <h2 class="settings-section-title">Account</h2>
        <div class="settings-actions">
          <a href="./forgot-password.html" class="secondary-button">Change password</a>
          <button id="signOutBtn" class="secondary-button">Sign out</button>
        </div>
        <div class="settings-danger">
          <p class="fine-print settings-danger-note">Signing out will end your session on this device.</p>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>
  <script type="module">
    import { requireAuth, signOut, getUser } from "./js/auth.js";
    import { fetchPreferences, updatePreferences } from "./js/api.js";
    import { toast } from "./js/utils.js";

    window.lucide?.createIcons();
    await requireAuth("./login.html");

    const notice = document.getElementById("settingsNotice");
    function showNotice(msg, type = "success") {
      notice.textContent = msg;
      notice.className = `auth-notice auth-notice--${type}`;
      notice.hidden = false;
      setTimeout(() => { notice.hidden = true; }, 4000);
    }

    // Load user email
    const user = await getUser();
    if (user) document.getElementById("userEmail").textContent = user.email || "";

    // Load preferences
    let prefs = {};
    let interests = [];
    try {
      const data = await fetchPreferences();
      prefs = data.preferences || {};
      interests = data.interests || [];
      const profile = data.profile || {};

      document.getElementById("displayName").value = profile.display_name || "";
      document.getElementById("prefLang").value = prefs.language || "en";
      document.getElementById("prefCountry").value = prefs.country || "";
      document.getElementById("trackingEnabled").checked = prefs.tracking_enabled !== false;

      // Show current interests
      const pillsWrap = document.getElementById("currentInterests");
      if (interests.length) {
        pillsWrap.innerHTML = interests.map(i => `<span class="interest-pill">${i.category_slug}</span>`).join("");
      } else {
        pillsWrap.innerHTML = `<p class="muted">No interests selected yet. <a href="./discover.html">Discover topics</a></p>`;
      }
    } catch (err) {
      showNotice("Could not load preferences: " + err.message, "error");
    }

    // Save profile
    document.getElementById("saveProfile").addEventListener("click", async () => {
      const name = document.getElementById("displayName").value.trim();
      try {
        // Profile is stored in Supabase profiles table via Supabase client
        const { url, anonKey } = window.NEWS_CONFIG || {};
        if (url && anonKey && window.supabase) {
          const client = window.supabase.createClient(url, anonKey);
          const { error } = await client.from("profiles").upsert({ id: user.id, display_name: name });
          if (error) throw error;
        }
        showNotice("Profile saved");
      } catch (err) {
        showNotice(err.message || "Failed to save profile", "error");
      }
    });

    // Save preferences
    document.getElementById("savePreferences").addEventListener("click", async () => {
      try {
        await updatePreferences({
          language: document.getElementById("prefLang").value,
          country: document.getElementById("prefCountry").value.trim() || null,
          tracking_enabled: document.getElementById("trackingEnabled").checked,
        });
        showNotice("Preferences saved");
      } catch (err) {
        showNotice(err.message || "Failed to save preferences", "error");
      }
    });

    // Sign out
    document.getElementById("signOutBtn").addEventListener("click", async () => {
      await signOut();
      location.replace("./login.html");
    });
  </script>
</body>
</html>
