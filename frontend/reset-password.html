<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2F0EA">
  <title>Set New Password — NovaPress</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./js/lucide.min.js"></script>
</head>
<body class="auth-page">
  <div class="auth-layout">
    <div class="auth-brand">
      <a href="./index.html" class="brand" aria-label="NovaPress home">
        <img src="./logo.svg" alt="NovaPress" class="brand-logo">
      </a>
    </div>

    <!-- Loading state while establishing session -->
    <div class="auth-card" id="loadingCard">
      <div class="spinner"></div>
      <p class="auth-subtitle" style="text-align:center;margin-top:12px">Verifying reset link…</p>
    </div>

    <!-- Error state: expired / invalid link -->
    <div class="auth-card" id="errorCard" hidden>
      <div class="confirm-icon"><i data-lucide="alert-triangle" style="width:40px;height:40px;color:#F59E0B"></i></div>
      <h1 class="auth-title">Link expired</h1>
      <p class="auth-subtitle" id="errorMsg">This password reset link is invalid or has expired.</p>
      <a href="./forgot-password.html" class="primary-button w-full" style="display:block;text-align:center;text-decoration:none;margin-top:20px">
        Request new link <span>→</span>
      </a>
      <p class="auth-switch" style="margin-top:16px"><a href="./login.html" class="auth-link">← Back to sign in</a></p>
    </div>

    <!-- Password form — shown only after session is confirmed -->
    <div class="auth-card" id="formCard" hidden>
      <h1 class="auth-title">Set new password</h1>
      <p class="auth-subtitle">Choose a strong password for your account.</p>
      <div id="notice" class="auth-notice" hidden></div>
      <form id="resetForm" class="auth-form" novalidate>
        <div class="field">
          <label for="password"><span>NEW PASSWORD</span></label>
          <div class="input-with-toggle">
            <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8">
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password"><i data-lucide="eye"></i></button>
          </div>
          <div class="pw-strength" id="pwStrength"></div>
          <span class="field-error" id="passwordError"></span>
        </div>
        <div class="field">
          <label for="confirm"><span>CONFIRM PASSWORD</span></label>
          <input id="confirm" type="password" autocomplete="new-password" placeholder="Repeat password" required>
          <span class="field-error" id="confirmError"></span>
        </div>
        <button type="submit" id="submitBtn" class="primary-button w-full">
          Update password <span>→</span>
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>
  <script type="module">
    import { updatePassword, getSession, onAuthStateChange } from "./js/auth.js";
    import { passwordStrength, renderPasswordStrength } from "./js/components.js";

    const loadingCard = document.getElementById("loadingCard");
    const errorCard   = document.getElementById("errorCard");
    const formCard    = document.getElementById("formCard");
    const notice      = document.getElementById("notice");
    const pwInput     = document.getElementById("password");
    const pwStrength  = document.getElementById("pwStrength");
    const togglePw    = document.getElementById("togglePw");

    // ── helpers ──────────────────────────────────────────────
    function showLoading() {
      loadingCard.hidden = false; errorCard.hidden = true; formCard.hidden = true;
    }
    function showError(msg) {
      loadingCard.hidden = true; errorCard.hidden = false; formCard.hidden = true;
      if (msg) document.getElementById("errorMsg").textContent = msg;
    }
    function showForm() {
      loadingCard.hidden = true; errorCard.hidden = true; formCard.hidden = false;
      pwInput.focus();
    }
    function showNotice(msg, type = "error") {
      notice.textContent = msg;
      notice.hidden = false;
      notice.className = `auth-notice auth-notice--${type}`;
    }

    // ── password strength meter ───────────────────────────────
    window.lucide?.createIcons();

    togglePw.addEventListener("click", () => {
      const isHidden = pwInput.type === "password";
      pwInput.type = isHidden ? "text" : "password";
      togglePw.innerHTML = isHidden
        ? `<i data-lucide="eye-off" style="width:16px;height:16px"></i>`
        : `<i data-lucide="eye" style="width:16px;height:16px"></i>`;
      window.lucide?.createIcons();
    });
    pwInput.addEventListener("input", () => {
      const score = passwordStrength(pwInput.value);
      const { label, cls } = renderPasswordStrength(score);
      pwStrength.innerHTML = label
        ? `<div class="pw-bar"><div class="pw-fill pw-fill--${cls}" style="width:${score*20}%"></div></div><span class="pw-label">${label}</span>`
        : "";
    });

    // ── form submit ───────────────────────────────────────────
    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = pwInput.value;
      const confirm  = document.getElementById("confirm").value;
      document.getElementById("passwordError").textContent = "";
      document.getElementById("confirmError").textContent  = "";
      if (password.length < 8) { document.getElementById("passwordError").textContent = "At least 8 characters"; return; }
      if (password !== confirm) { document.getElementById("confirmError").textContent  = "Passwords do not match"; return; }
      const btn = document.getElementById("submitBtn");
      btn.disabled = true; btn.textContent = "Updating…";
      try {
        await updatePassword(password);
        location.replace("./login.html?message=Password+updated.+Please+sign+in.");
      } catch (err) {
        btn.disabled = false; btn.innerHTML = "Update password <span>→</span>";
        showNotice(err.message || "Failed to update password.");
      }
    });

    // ── session recovery flow ─────────────────────────────────
    // Parse URL: Supabase appends either ?code=xxx (PKCE) or #access_token=xxx&type=recovery
    // Errors come as #error=access_denied&error_code=otp_expired
    const hashParams   = new URLSearchParams(location.hash.slice(1));
    const searchParams = new URLSearchParams(location.search);

    const errorInHash  = hashParams.get("error");
    const codeInQuery  = searchParams.get("code");
    const tokenInHash  = hashParams.get("access_token");

    if (errorInHash) {
      // Link explicitly rejected by Supabase (expired, already used, etc.)
      const desc = hashParams.get("error_description") || "";
      const msg = desc.includes("expired")
        ? "This reset link has expired. Reset links are valid for 1 hour."
        : desc
          ? decodeURIComponent(desc.replace(/\+/g, " "))
          : "This reset link is invalid or has already been used.";
      showError(msg);

    } else if (codeInQuery || tokenInHash) {
      // Valid-looking token — trigger client creation so Supabase SDK auto-exchanges the code,
      // then wait for PASSWORD_RECOVERY (or SIGNED_IN) event.
      showLoading();

      // Calling getSession() forces client creation which triggers detectSessionInUrl.
      // The SDK will call exchangeCodeForSession(code) automatically for PKCE.
      getSession().catch(() => {});

      let settled = false;

      const unsubscribe = onAuthStateChange((event, session) => {
        if (settled) return;
        if (event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && session)) {
          settled = true;
          unsubscribe();
          showForm();
        }
      });

      // If the SDK already had a recovery session before we subscribed, check now
      getSession().then(session => {
        if (settled) return;
        if (session) {
          settled = true;
          unsubscribe();
          showForm();
        }
      });

      // Timeout: if no event after 12 s, the exchange failed
      setTimeout(() => {
        if (!settled) {
          settled = true;
          unsubscribe();
          showError("Could not verify the reset link. It may have expired — please request a new one.");
        }
      }, 12000);

    } else {
      // No token at all — user navigated here directly
      showError("No reset token found. Please use the link from your email or request a new one.");
    }
  </script>
</body>
</html>
